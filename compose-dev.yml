services:
  musiseerr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      LIDARR_URL: ${LIDARR_URL}
    restart: unless-stopped
  lidarr:
    image: ghcr.io/hotio/lidarr:latest
    ports:
      - "8686:8686"